name: Docker CI

on:
  push:
    banches: [ "master" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - n: Build Docker image
        run: docker build -t cloud-dashboard .

      - name: Run container
        run: docker run -d -p 5000:5000 --name test-container cloud-dashboard

      - name: wait for app health
        run: |
          for i in {1..10}; do
            if curl -f http://localhost:5000/health; then
              echo "App is healthy"
              exit 0
            fi
            echo "Waiting for app..."
            sleep 2
          done
          echo "App failed health check"
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs test-container
      
      - name: Cleanup
        if: always()
        run: docker rm -f test-container
        

