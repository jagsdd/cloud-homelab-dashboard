name: Docker CI

on:
  push:
    branches: [ "master" ]

permissions:
  contents: read
  packages: write

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: cloud-dashboard:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: save docker image
        run: docker save cloud-dashboard:latest -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar


  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start stack (CI override)
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build

      - name: Wait for health checkout
        run: |
          for i in {1..15}; do
            if curl -f http://localhost:5000/health; then
              echo "App is healthy"
              exit 0
            fi
            echo "Waiting..."
            sleep 2
          done
          echo "App failed health check"
          exit 1
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run integration tests
        run: pytest tests/test_integration.py -v
      
      - name: Shutdown stack
        if: always()
        run: docker compose down -v
        
  
  publish:
    runs-on: ubuntu-latest
    needs: test
  
    steps:
      - name: download docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: load docker image
        run: docker load -i image.tar

      - name: log in to GCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: tag image
        run: |
          docker tag cloud-dashboard:latest ghcr.io/jagsdd/cloud-homelab-dashboard:latest
          docker tag cloud-dashboard:latest ghcr.io/jagsdd/cloud-homelab-dashboard:${{ github.run_number }}

      - name: push latest
        run: docker push ghcr.io/jagsdd/cloud-homelab-dashboard:latest

      - name: push versioned
        run: docker push ghcr.io/jagsdd/cloud-homelab-dashboard:${{ github.run_number }}












        

