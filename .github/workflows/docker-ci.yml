name: Docker CI

on:
  push:
    branches: [ "master" ]

permissions:
  contents: read
  packages: write

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: cloud-dashboard:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: save docker image
        run: docker save cloud-dashboard:latest -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar

  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: pip install -r requirements-test.txt
      
      - name: Run unit tests
        run: pytest tests/test_service.py tests/test_repository.py -v
      


  integration-tests:
    runs-on: ubuntu-latest
    needs: build
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dashboard

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
      
      - name: Load docker image
        run: docker load -i image.tar

      - name: Start stack (CI override)
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d

      - name: Wait for health check
        run: |
          for i in {1..15}; do
            if curl -f http://localhost:5000/health; then
              echo "App is healthy"
              exit 0
            fi
            echo "Waiting..."
            sleep 2
          done
          echo "App failed health check"
          exit 1
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Run integration tests
        run: pytest tests/test_integration.py -v
      
      - name: Show compose status
        if: failure()
        run: docker compose ps
      
      - name: Show dashboard logs
        if: failure()
        run: docker compose logs dashboard

      - name: Show database logs
        if: failure()
        run: docker compose logs database
      
      - name: Shutdown stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
        
  
  publish:
    runs-on: ubuntu-latest
    needs: [integration-tests, unit-tests]
  
    steps:
      - name: download docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: load docker image
        run: docker load -i image.tar

      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: tag image
        run: |
          docker tag cloud-dashboard:latest ghcr.io/jagsdd/cloud-homelab-dashboard:latest
          docker tag cloud-dashboard:latest ghcr.io/jagsdd/cloud-homelab-dashboard:${{ github.run_number }}
          docker tag cloud-dashboard:latest ghcr.io/jagsdd/cloud-homelab-dashboard:${{ github.sha }}

      - name: push latest
        run: docker push ghcr.io/jagsdd/cloud-homelab-dashboard:latest

      - name: push versioned
        run: docker push ghcr.io/jagsdd/cloud-homelab-dashboard:${{ github.run_number }}

      - name: push commit
        run: docker push ghcr.io/jagsdd/cloud-homelab-dashboard:${{ github.sha }}

  aws-ssm-test:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::712236451077:role/github-actions-cloud-homelab-deploy
          aws-region: eu-west-2

      - name: Run command on EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0a71bd53ae126b0ea \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["whoami","hostname","docker --version"]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-0a71bd53ae126b0ea

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0a71bd53ae126b0ea \
            --query "StandardOutputContent" \
            --output text