services:

  dashboard:
    build: .
    container_name: cloud-dashboard
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@database:5432/dashboard
      TEST_DATABASE_URL: postgresql://postgres:postgres@database:5432/dashboard_test
    depends_on:
      database:
        condition: service_healthy
  
  database:
    ports:
      - "5432:5432"
    
    volumes: []

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
