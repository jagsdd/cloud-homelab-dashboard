services:
  dashboard:
    build: .
    container_name: cloud-dashboard
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@database:5432/dashboard
      - TEST_DATABASE_URL=postgresql://postgres:postgres@database:5432/dashboard_test
    depends_on:
      database:
        condition: service_healthy
  
  database:
    image: postgres:17
    container_name: cloud-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dashboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    
  
volumes:
  postgres_data:    


